name: Build & Release

# 触发：推送到 main 自动构建并发布「新版本号的 Release」；也支持推 v* 标签与手动触发。
#
# 为什么不再固定发到 `latest` 那个 release：
# GitHub 的 release 列表显示的是「首次发布日期」，复用一个固定标签去覆盖资源，
# 页面上的日期永远是最初那一天，看起来像没更新（资源其实已经换了）。
# 改成每次构建都递增一个版本号并新建 release，仓库首页的 Releases 就能看到
# 当天的新版本，下载链接也仍然稳定（资产名固定不变）。
#
# 另外：只有「会影响产物」的文件变化才发新版本（白名单见 paths），
# 改 README / 记忆 / 工作流本身、删个旧产物都不会凭空多出一个 release。
# 注意「路径过滤对 tag 推送不生效」，所以手动推 v* 标签一定会构建；
# 改完工作流想验证，用 workflow_dispatch 手动跑。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**.py'
      - 'icon.ico'
      - 'icon.png'
  workflow_dispatch:

# 发布 release / 打 tag 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要读取全部 v* 标签来计算下一个版本号

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 下载 UPX 并加入 PATH，供 PyInstaller 压缩体积（GitHub 运行器默认不带 UPX）
      # 注意：Windows runner 的 bash 里 tar 是 GNU tar，不能解 .zip，故用 PowerShell 的 Expand-Archive
      - name: Install UPX
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx_tmp -Force
          $upxDir = (Get-ChildItem -Path upx_tmp -Recurse -Filter upx.exe | Select-Object -First 1).DirectoryName
          if (-not $upxDir) { throw "UPX 解压后未找到 upx.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $upxDir -Encoding utf8
          Write-Host "UPX dir: $upxDir"

      # 由 appicon.py 纯代码生成图标，保证 exe 图标 / 任务栏 / 托盘与界面 logo 一致。
      # 同时校验图标可在无第三方库的环境下生成（本程序已完全去除 Pillow 依赖）。
      - name: Generate icons
        run: python gen_icon.py

      # 版本号：推 v* 标签时用标签本身；main 推送时取现有最高 vX.Y 再加 1。
      # 必须在构建之前算出来 —— 版本号要写进 version.txt 打进 exe，
      # 界面的状态栏会显示它，这样「用户手上跑的是哪一版」一眼可辨。
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            LAST=$(git tag -l 'v[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [[ -z "$LAST" ]]; then
              V="v1.0"
            else
              V="${LAST%.*}.$(( ${LAST##*.} + 1 ))"
            fi
          fi
          printf '%s' "$V" > version.txt
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$V"

      # 构建两个 exe：AlwaysOnTop.exe（常规）与 AlwaysOnTop_v2.exe（改名破除图标缓存）
      # --add-data 把 version.txt 一起打进去（onefile 会解到 sys._MEIPASS）
      - name: Build exes
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AlwaysOnTop --icon icon.ico --add-data "version.txt;." ontop.py
          mkdir release
          copy dist\AlwaysOnTop.exe release\AlwaysOnTop.exe
          pyinstaller --noconfirm --onefile --windowed --name AlwaysOnTop_v2 --icon icon.ico --add-data "version.txt;." ontop.py
          copy dist\AlwaysOnTop_v2.exe release\AlwaysOnTop_v2.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AlwaysOnTop ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/AlwaysOnTop.exe
            release/AlwaysOnTop_v2.exe
